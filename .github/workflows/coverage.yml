# Runs the containment suite with coverage on every PR and on main; octocov (.octocov.yml) turns
# the profile into one comment on the PR, edited in place on each push, and the run's summary.
#
# On a PR the comment has a Patch Coverage column: of this PR's changed lines, how many a test
# runs. Its coverage links open a page (an artifact) of the PR's changed hunks with each line's
# coverage beside them. The page and the comparison need a report from main to compare against,
# which the first run on main after this merges stores. Code that tests run only as built
# binaries (cmd/*) is not counted.
#
# A failing test fails the suite step itself, so the red step is the one whose log names the
# test; on a PR the failing tests are also posted as a comment. octocov still reports what ran.
#
# TestCGate* and TestBuiltGateStacks are skipped. They need d1preservation's root (design/,
# d1-server/, the built Rust binaries), so install.sh runs them during d1 containment install.
# SKIP is rootBoundControls in d1preservation's tools/d1; d1 containment pr refuses a workflow
# that runs go test without it.
#
# macOS, because the suite runs sandbox-exec. Private-repo minutes on macOS count ten times.
# Actions and the octocov binary are pinned.
name: coverage

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write # the comment
  actions: write # octocov's report artifacts, and deleting a PR's superseded pages

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      SKIP: ^TestCGate|^TestBuiltGateStacks$
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
          cache: false

      # Two ways the runner differs from a workstation, each failing a test for a reason that is
      # not the containment's (09.18, run 41114995797).
      - name: make the runner look like a workstation
        run: |
          # TestResolver: the runner lists its own LocalHostName.local in /etc/hosts, so the name
          # resolves from that file without the mDNS service game.sb denies. Drop it, so only
          # the service can answer, as on a Mac.
          name="$(scutil --get LocalHostName).local"
          grep -n -i -w -F "$name" /etc/hosts || echo "$name is not in /etc/hosts"
          grep -v -i -w -F "$name" /etc/hosts > "$RUNNER_TEMP/hosts" || true
          sudo cp "$RUNNER_TEMP/hosts" /etc/hosts
          sudo dscacheutil -flushcache
          # TestHookElevatedForm: the hook admits code only as /usr/local/bin/code, and the runner
          # has no VS Code. The tests never run this placeholder; anything that does gets exit 1.
          if [ ! -e /usr/local/bin/code ]; then
            printf '#!/bin/sh\necho "CI placeholder for /usr/local/bin/code, not VS Code" >&2\nexit 1\n' > "$RUNNER_TEMP/code"
            sudo mkdir -p /usr/local/bin
            sudo install -m 755 "$RUNNER_TEMP/code" /usr/local/bin/code
          fi

      - name: containment suite with coverage
        working-directory: containment/go
        shell: bash # -eo pipefail: the step fails when go test does, through the pipe
        run: |
          # TestLocalOnlySabotage, TestNonetSabotage: the runner passes open sockets to each step
          # (descriptors 131 and 140), and the launchers' prove step rightly refuses inherited
          # sockets. Close every descriptor above stderr but 255, bash's handle on this script.
          for fd in /dev/fd/*; do
            n=${fd##*/}
            if [ "$n" -gt 2 ] && [ "$n" -ne 255 ]; then eval "exec $n>&-"; fi
          done
          go test -count=1 -skip "$SKIP" -coverpkg=./... -coverprofile="$GITHUB_WORKSPACE/coverage.out" ./... 2>&1 | tee "$RUNNER_TEMP/suite.txt"

      # The failing tests as a PR comment, readable without the job log.
      - name: post the failing tests on the PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          grep -E -A12 '^--- FAIL|^panic:|\[(build|setup) failed\]' "$RUNNER_TEMP/suite.txt" | head -150 > "$RUNNER_TEMP/fails.txt" || exit 0
          [ -s "$RUNNER_TEMP/fails.txt" ] || exit 0
          { echo "**containment suite failed** (run $GITHUB_RUN_ID, attempt $GITHUB_RUN_ATTEMPT)"; echo '```'; cat "$RUNNER_TEMP/fails.txt"; echo '```'; } > "$RUNNER_TEMP/fails.md"
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/fails.md"

      - uses: k1LoW/octocov-action@a167dc0dee441b7ffc45e1b862ab55ec0d87f278 # v1.5.2
        if: always() && hashFiles('coverage.out') != ''
        with:
          version: v0.83.0
          checksum: 668a3dbaa7e04dd2f2227d76250a42e1bc82712882caad4dc92df174fa1fb2f7 # octocov_v0.83.0_darwin_arm64.zip
